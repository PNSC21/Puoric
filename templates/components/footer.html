<footer class="footer">

    <div class="container-custom">

        <div class="footer-grid">

            <div>

                <img src="{{ url_for('static', filename='images/image.png') }}" class="footer-logo" alt="{{ site.name }}">

                <h3>{{ site.name }}</h3>

                <p>
                    {{ site.description }}
                </p>

            </div>

            <div>

                <h5>Quick Links</h5>

                <ul>

                    <li><a href="/">Home</a></li>

                    <li><a href="#">Products</a></li>

                    <li><a href="#">Beauty Advisor</a></li>

                    <li><a href="#">Contact</a></li>

                </ul>

            </div>

            <div>

                <h5>Contact</h5>

                <ul>

                    <li>{{ site.phone }}</li>

                    <li>{{ site.email }}</li>

                    <li>{{ site.address }}</li>

                </ul>

            </div>

            <div>

                <h5>Follow Us</h5>

                <div class="footer-social">

                    <a href="{{ site.instagram }}">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://wa.me/{{ site.whatsapp }}">
                        <i class="bi bi-whatsapp"></i>
                    </a>

                    <a href="{{ site.facebook }}">
                        <i class="bi bi-facebook"></i>
                    </a>

                </div>

            </div>

        </div>

        <hr>

        <p class="footer-copy">
            {{ site.copyright }}
        </p>

    </div>

</footer>
