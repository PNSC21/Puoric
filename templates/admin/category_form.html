{% extends "base.html" %}
{% block title %}{{ "Edit" if category else "Add" }} category | Puoric admin{% endblock %}
{% block content %}
<section class="section dashboard-section">
    <div class="container-custom">
        <header class="page-heading"><p class="eyebrow">CATALOGUE</p><h1>{{ "Edit category" if category else "Add a category" }}</h1></header>
        {% set area = "admin" %}{% include "components/dashboard_nav.html" %}
        <form class="form-card form-card-wide" method="post" enctype="multipart/form-data">
            <div class="form-grid">
                <label>Category name<input name="name" maxlength="100" required value="{{ category.name if category else '' }}"></label>
                <label class="field-wide">Description<textarea name="description" rows="4">{{ category.description if category else '' }}</textarea></label>
                <label class="field-wide">Category image<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"><span class="muted">JPG, PNG, or WebP; maximum 5 MB.</span>{% if category and category.image %}<img class="admin-image-preview" src="{{ url_for('static', filename=category.image) }}" alt="{{ category.name }}">{% endif %}</label>
            </div>
            <div class="inline-actions"><button class="btn-primary-custom" type="submit">Save category</button><a class="btn-outline-custom" href="{{ url_for('admin.categories') }}">Cancel</a></div>
        </form>
    </div>
</section>
{% endblock %}
